[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "bmqol"
version = "1.0.0"
description = "Rank-depth adaptive block matrix products for quantum operator learning"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Molena Huynh", email = "molena.huynh@jmp.com"}]
keywords = ["block Krylov", "matrix functions", "quantum operator learning", "matrix-free"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bmqol-reproduce = "bmqol.experiment:main"
bmqol-validate = "bmqol.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bmqol = ["results/*.json", "results/*.csv", "results/*.tex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

